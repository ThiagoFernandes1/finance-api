services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5432:5432"
    volumes:
      - finance-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: finance-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/finance
      DB_USER: finance
      DB_PASSWORD: finance
      JWT_SECRET: troque-esta-chave-em-producao-com-no-minimo-32-bytes
    ports:
      - "8080:8080"

volumes:
  finance-data:
