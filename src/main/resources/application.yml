spring:
  application:
    name: finance-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${DB_USER:finance}
    password: ${DB_PASSWORD:finance}

  jpa:
    hibernate:
      # O schema e responsabilidade exclusiva do Flyway.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Em producao, definido obrigatoriamente por variavel de ambiente.
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-com-no-minimo-32-bytes}
    expiration: ${JWT_EXPIRATION:PT8H}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.thiago.financeapi: INFO

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
