spring:
  datasource:
    url: jdbc:h2:mem:finance;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    # O schema de teste vem do Hibernate; as migrations sao validadas no ciclo de CI
    # contra Postgres, evitando divergencia de dialeto no H2.
    enabled: false

app:
  jwt:
    secret: chave-de-teste-com-tamanho-suficiente-para-hmac-sha256
    expiration: PT1H
